[package]
name = "tidal-daemon"
version = "0.1.0"
edition = "2021"
authors = ["jaj"]
description = "Lean background daemon for Omarchy Tidal music streaming and MPRIS integration"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
base64 = "0.22"
libc = "0.2"
dbus = { version = "0.9.12", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test backend
        run: cargo test --manifest-path backend/Cargo.toml --locked
      - name: Validate plugin manifest structure
        run: |
          jq -e '(.schemaVersion == 1) and (.id | type == "string" and length > 0) and (.version | type == "string") and (.kinds | type == "array" and length > 0) and (.entryPoints | type == "object")' manifest.json

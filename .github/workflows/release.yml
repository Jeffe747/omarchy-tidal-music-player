name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact_name: tidal-daemon-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact_name: tidal-daemon-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build x86_64 release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: backend
        env:
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
          RUSTFLAGS: -C target-cpu=x86-64
        run: cargo build --release --target x86_64-unknown-linux-gnu --locked
      - name: Build aarch64 release
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target aarch64-unknown-linux-gnu --manifest-path backend/Cargo.toml --locked --features dbus/vendored
      - name: Strip x86_64 binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          strip --strip-all --remove-section=.comment --remove-section='.note*' --remove-section=.eh_frame --remove-section=.eh_frame_hdr backend/target/${{ matrix.target }}/release/tidal-daemon
      - name: Strip aarch64 binary
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu && aarch64-linux-gnu-strip backend/target/aarch64-unknown-linux-gnu/release/tidal-daemon
      - name: Stage release binary
        run: install -Dm755 backend/target/${{ matrix.target }}/release/tidal-daemon "dist/${{ matrix.artifact_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
      - name: Check Ivy Bridge crypto compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: backend
        env:
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
          RUSTFLAGS: -C target-cpu=x86-64
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user
          test_binary="$(cargo test --release --target x86_64-unknown-linux-gnu --locked --no-run --message-format=json | jq -r 'select(.profile.test == true and .target.name == "tidal-daemon") | .executable' | tail -n 1)"
          test -n "$test_binary"
          qemu-x86_64 -cpu IvyBridge "$test_binary" test_crypto_compatibility --exact --nocapture

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum tidal-daemon-x86_64 tidal-daemon-aarch64 > SHA256SUMS
      - name: Verify committed release assets and runtime pins
        run: |
          test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
          diff -u SHA256SUMS dist/SHA256SUMS
          cmp bin/tidal-daemon dist/tidal-daemon-x86_64
          while read -r digest asset; do
            test "$(grep -Foc "$digest" Service.qml)" -eq 2
          done < SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tidal-daemon-x86_64
            dist/tidal-daemon-aarch64
            dist/SHA256SUMS
          generate_release_notes: true
